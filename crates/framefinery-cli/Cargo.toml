[package]
name = "framefinery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Safe Rust media pipeline toolkit and FrameFinery command-line encoder."
documentation = "https://docs.rs/framefinery"
default-run = "ff"

[lib]
name = "framefinery"
path = "src/lib.rs"

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
framefinery-core = { path = "../framefinery-core", version = "0.0.2", default-features = false }
framefinery-codecs = { path = "../framefinery-codecs", version = "0.0.2", optional = true, default-features = false }

[features]
default = ["all-codecs", "product-filters"]
all-codecs = ["av2", "vvc"]
product-filters = ["filter-pattern", "filter-identity"]
all-filters = ["product-filters", "filter-crop", "filter-scale"]
av2 = ["codec-av2"]
vvc = ["codec-vvc"]
video-encoders = ["dep:framefinery-codecs"]
codec-av2 = ["video-encoders", "framefinery-codecs/av2"]
codec-vvc = ["video-encoders", "framefinery-codecs/vvc"]
filter-pattern = ["framefinery-core/filter-pattern"]
filter-identity = ["framefinery-core/filter-identity"]
filter-crop = ["framefinery-core/filter-crop"]
filter-scale = ["framefinery-core/filter-scale"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
