[package]
name = "framefinery-codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["multimedia::video", "multimedia::encoding", "encoding"]
description = "Experimental codec models for FrameFinery."
documentation = "https://docs.rs/framefinery-codecs"

[dependencies]
framefinery-api = { path = "../framefinery-api", version = "0.0.3", default-features = false }

[dev-dependencies]
criterion = "0.5"

[features]
default = []
av2 = []
av2-stats = ["av2"]
av2-lossy-stats = ["av2"]
av2-sb-bit-profile = ["av2"]
bench-internals = ["av2", "vvc"]
dead-code-audit = []
vvc = []
vvc-stats = ["vvc"]

[[bench]]
name = "av2_micro"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "vvc_micro"
harness = false
required-features = ["bench-internals"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["av2", "vvc"]
rustdoc-args = ["--cfg", "docsrs"]
