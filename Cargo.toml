[workspace]
resolver = "2"
members = [
  "crates/framefinery-core",
  "crates/framefinery-codecs",
  "crates/framefinery-cli",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
repository = "https://github.com/framefinery/framefinery-engine"
readme = "README.md"
keywords = ["media", "video", "codec", "encoder", "pipeline"]
categories = [
  "command-line-utilities",
  "multimedia::video",
  "multimedia::encoding",
  "encoding",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.optimized]
inherits = "release"
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "none"
